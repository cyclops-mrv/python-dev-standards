[mypy]
# Target Python version for type checking
python_version = 3.11
# Warn when a function returns Any type
warn_return_any = true
# Require type annotations for all function definitions
disallow_untyped_defs = true
# Don't error on missing type stubs for third-party libraries
ignore_missing_imports = true 

# ---- Per-library stub overrides ----
[mypy-dask.*]
ignore_missing_imports = true

[mypy-xarray.*]
ignore_missing_imports = true

[mypy-rioxarray.*]
ignore_missing_imports = true

[mypy-odc.*]
ignore_missing_imports = true

[mypy-pystac_client.*]
ignore_missing_imports = true
