[mypy]
python_version = 3.11
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = False

# ---- Per-library stub overrides ----
[mypy-dask.*]
ignore_missing_imports = True

[mypy-xarray.*]
ignore_missing_imports = True

[mypy-rioxarray.*]
ignore_missing_imports = True

[mypy-odc.*]
ignore_missing_imports = True

[mypy-pystac_client.*]
ignore_missing_imports = True
