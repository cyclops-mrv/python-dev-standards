# Prefect deploy caller (template)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, dev]

jobs:
  deploy:
    uses: cyclops-mrv/python-dev-standards/.github/workflows/deploy-prefect-flow.yml@dev
    with:
      image_name: <dockerhub-org>/<image-name>
      # Single-project repo (AGB-style): project_dir defaults to "."
      # Workspace monorepo app (RAM-style):
      # project_dir: apps/<app-name>
      # dockerfile and prefect_file default to deployment/Dockerfile and deployment/prefect.yaml
    secrets: inherit
