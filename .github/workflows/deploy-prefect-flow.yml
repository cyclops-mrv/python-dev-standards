name: Deploy Prefect flow

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      project_dir:
        required: false
        type: string
        default: "."
        description: >-
          Directory containing the deployable pyproject.toml. dockerfile and
          prefect_file are relative to this directory. Use "." for single-project
          repos (e.g. deployment/Dockerfile under repo root). Prefect deploy uses
          `uv run --project` from the repository root so monorepo entrypoints resolve.
      dockerfile:
        required: false
        type: string
        default: "deployment/Dockerfile"
      prefect_file:
        required: false
        type: string
        default: "deployment/prefect.yaml"
      python_version:
        required: false
        type: string
        default: "3.12"
      deploy_feature_branches:
        required: false
        type: boolean
        default: true
        description: >-
          When true (default), deploy ephemeral Prefect environments for feature-branch PRs.
          Set false to skip feature-branch PR deploys (merged PRs and dev→main PRs still deploy).

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DOCKERFILE_PATH: ${{ inputs.project_dir == '.' && inputs.dockerfile || format('{0}/{1}', inputs.project_dir, inputs.dockerfile) }}
      PREFECT_FILE_PATH: ${{ inputs.project_dir == '.' && inputs.prefect_file || format('{0}/{1}', inputs.project_dir, inputs.prefect_file) }}
    # PR-only deploy model: no push triggers. Persistent main/dev deploys run on
    # pull_request closed + merged; review deploys on opened/synchronize/reopened.
    # Skip feature-branch PRs when deploy_feature_branches is false.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       github.event.action != 'closed' ||
       github.event.pull_request.merged == true) &&
      (inputs.deploy_feature_branches ||
       github.event_name != 'pull_request' ||
       github.event.action == 'closed' ||
       github.event.pull_request.head.ref == 'dev')

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}

      # Must match the @ref on deploy-prefect-flow.yml in consumer callers.
      - name: Resolve deployment context
        id: resolve
        uses: cyclops-mrv/python-dev-standards/.github/actions/resolve-deploy-context@dev
        with:
          event_name: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && 'push' || github.event_name }}
          branch_name: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.base.ref || github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          image_name: ${{ inputs.image_name }}

      - name: Show deployment routing
        run: |
          echo "branch=${{ steps.resolve.outputs.branch_name }}"
          echo "branch_slug=${{ steps.resolve.outputs.branch_slug }}"
          echo "target_env=${{ steps.resolve.outputs.target_env }}"
          echo "deployment_name_suffix=${{ steps.resolve.outputs.deployment_name_suffix }}"
          echo "image_tag=${{ steps.resolve.outputs.image_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ vars.DOCKER_UID }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          build-args: |
            UV_PROJECT=${{ inputs.project_dir }}
          push: true
          tags: ${{ steps.resolve.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Prefect Deploy
        env:
          PREFECT_API_AUTH_STRING: ${{ steps.resolve.outputs.target_env == 'prod' && secrets.PRODUCTION_PREFECT_API_KEY || secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ steps.resolve.outputs.target_env == 'prod' && vars.PRODUCTION_PREFECT_API_URL || vars.PREFECT_API_URL }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          DEPLOYMENT_NAME_SUFFIX: ${{ steps.resolve.outputs.deployment_name_suffix }}
          PREFECT_PULL_BRANCH: ${{ steps.resolve.outputs.prefect_pull_branch }}
        run: |
          uv run --project "${{ inputs.project_dir }}" --only-group deployment \
            prefect --no-prompt deploy \
              --prefect-file "${{ env.PREFECT_FILE_PATH }}" \
              --all
