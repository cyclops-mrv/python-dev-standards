name: Deploy Prefect flow

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: "deployment/Dockerfile"
      prefect_file:
        required: false
        type: string
        default: "deployment/prefect.yaml"
      python_version:
        required: false
        type: string
        default: "3.12"
      deploy_feature_branches:
        required: false
        type: boolean
        default: false
        description: >-
          When true, deploy ephemeral Prefect environments for feature-branch PRs.
          When false (default), only push to main/dev and PRs with head dev deploy.

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Merged PRs are handled by the push event on the target branch; skip the
    # pull_request:closed event to prevent a consumer from firing deploy twice on merge.
    # Skip pull_request:synchronize when head is dev — pushing to dev fires both a push
    # event and a synchronize on the dev→main PR; the push run handles deploy.
    # Skip feature-branch PRs unless deploy_feature_branches is enabled.
    if: >-
      github.event.action != 'closed' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'dev' &&
        github.event.action == 'synchronize') &&
      (inputs.deploy_feature_branches ||
       github.event_name != 'pull_request' ||
       github.event.pull_request.head.ref == 'dev')
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve deployment context
        id: resolve
        uses: ./.github/actions/resolve-deploy-context
        with:
          event_name: ${{ github.event_name }}
          branch_name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          image_name: ${{ inputs.image_name }}

      - name: Show deployment routing
        run: |
          echo "branch=${{ steps.resolve.outputs.branch_name }}"
          echo "branch_slug=${{ steps.resolve.outputs.branch_slug }}"
          echo "target_env=${{ steps.resolve.outputs.target_env }}"
          echo "deployment_name_suffix=${{ steps.resolve.outputs.deployment_name_suffix }}"
          echo "image_tag=${{ steps.resolve.outputs.image_tag }}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ vars.DOCKER_UID }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Build and push image
        id: build-docker-image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.resolve.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Prefect Deploy
        env:
          PREFECT_API_AUTH_STRING: ${{ steps.resolve.outputs.target_env == 'prod' && secrets.PRODUCTION_PREFECT_API_KEY || secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ steps.resolve.outputs.target_env == 'prod' && vars.PRODUCTION_PREFECT_API_URL || vars.PREFECT_API_URL }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          DEPLOYMENT_NAME_SUFFIX: ${{ steps.resolve.outputs.deployment_name_suffix }}
          PREFECT_PULL_BRANCH: ${{ steps.resolve.outputs.prefect_pull_branch }}
        run: |
          uv run --only-group deployment \
            prefect --no-prompt deploy \
              --prefect-file ${{ inputs.prefect_file }} \
              --all
