name: Deploy Prefect flow

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: "deployment/Dockerfile"
      prefect_file:
        required: false
        type: string
        default: "deployment/prefect.yaml"
      python_version:
        required: false
        type: string
        default: "3.12"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Merged PRs are handled by the push event on the target branch; skip the
    # pull_request:closed event to prevent a consumer from firing deploy twice on merge.
    if: github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve deployment context
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          # For PR events use the head branch; for push events use the pushed branch.
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          BRANCH_SLUG="$(echo "${BRANCH_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-40)"
          [ -z "${BRANCH_SLUG}" ] && BRANCH_SLUG="branch"

          COMMIT_HASH="$(git rev-parse --short HEAD)"

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            # Push to main (merged PR or direct) → prod; push to dev → staging.
            [ "${BRANCH_NAME}" = "main" ] && TARGET_ENV="prod" || TARGET_ENV="staging"
            DEPLOYMENT_NAME_SUFFIX=""
          elif [ "${BRANCH_NAME}" = "dev" ]; then
            # PR from dev (dev → main): deploy to staging without an ephemeral suffix.
            TARGET_ENV="staging"
            DEPLOYMENT_NAME_SUFFIX=""
          else
            # PR from a feature branch: ephemeral staging deployment with branch suffix.
            TARGET_ENV="staging"
            DEPLOYMENT_NAME_SUFFIX="-${BRANCH_SLUG}"
          fi

          [ -n "${DEPLOYMENT_NAME_SUFFIX}" ] \
            && IMAGE_TAG="${{ inputs.image_name }}:${COMMIT_HASH}-${BRANCH_SLUG}" \
            || IMAGE_TAG="${{ inputs.image_name }}:${COMMIT_HASH}"

          {
            echo "branch_name=${BRANCH_NAME}"
            echo "branch_slug=${BRANCH_SLUG}"
            echo "commit_hash=${COMMIT_HASH}"
            echo "target_env=${TARGET_ENV}"
            echo "deployment_name_suffix=${DEPLOYMENT_NAME_SUFFIX}"
            echo "prefect_pull_branch=${BRANCH_NAME}"
            echo "image_tag=${IMAGE_TAG}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "docker_tags<<EOF"
            echo "${IMAGE_TAG}"
            [ "${TARGET_ENV}" = "prod" ] && echo "${{ inputs.image_name }}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Show deployment routing
        run: |
          echo "branch=${{ steps.resolve.outputs.branch_name }}"
          echo "branch_slug=${{ steps.resolve.outputs.branch_slug }}"
          echo "target_env=${{ steps.resolve.outputs.target_env }}"
          echo "deployment_name_suffix=${{ steps.resolve.outputs.deployment_name_suffix }}"
          echo "image_tag=${{ steps.resolve.outputs.image_tag }}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ vars.DOCKER_UID }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Build and push image
        id: build-docker-image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.resolve.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Prefect Deploy
        env:
          PREFECT_API_AUTH_STRING: ${{ steps.resolve.outputs.target_env == 'prod' && secrets.PRODUCTION_PREFECT_API_KEY || secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ steps.resolve.outputs.target_env == 'prod' && vars.PRODUCTION_PREFECT_API_URL || vars.PREFECT_API_URL }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          DEPLOYMENT_NAME_SUFFIX: ${{ steps.resolve.outputs.deployment_name_suffix }}
          PREFECT_PULL_BRANCH: ${{ steps.resolve.outputs.prefect_pull_branch }}
        run: |
          uv run --only-group deployment \
            prefect --no-prompt deploy \
              --prefect-file ${{ inputs.prefect_file }} \
              --all
