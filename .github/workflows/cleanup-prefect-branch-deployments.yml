name: Cleanup Prefect branch deployments

on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - dev
  workflow_call:
    inputs:
      branch_name:
        required: false
        type: string
      project_dir:
        required: false
        type: string
        default: "."
      prefect_file:
        required: false
        type: string
        default: "deployment/prefect.yaml"
      python_version:
        required: false
        type: string
        default: "3.12"

jobs:
  cleanup:
    # Skip main (prod) and dev (persistent staging); other branches get ephemeral deployments.
    # Skip fork PRs so OIDC cannot fetch deploy secrets for untrusted heads.
    if: >-
      ${{ (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          (inputs.branch_name || github.event.pull_request.head.ref) != 'main' &&
          (inputs.branch_name || github.event.pull_request.head.ref) != 'dev' }}
    name: Cleanup staging branch deployments
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Resolve branch slug
        run: |
          BRANCH_NAME="${{ inputs.branch_name || github.event.pull_request.head.ref }}"

          if [ -z "${BRANCH_NAME}" ]; then
            echo "No branch provided for cleanup. Exiting."
            exit 0
          fi

          BRANCH_SLUG="$(echo "${BRANCH_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-40)"

          if [ -z "${BRANCH_SLUG}" ]; then
            echo "Unable to resolve branch slug for '${BRANCH_NAME}'. Exiting."
            exit 0
          fi

          echo "BRANCH_NAME=${BRANCH_NAME}" >> "${GITHUB_ENV}"
          echo "BRANCH_SLUG=${BRANCH_SLUG}" >> "${GITHUB_ENV}"

      # Must match the @ref on cleanup-prefect-branch-deployments.yml in consumer callers.
      - name: Fetch cleanup secrets from AWS Secrets Manager
        uses: cyclops-mrv/python-dev-standards/.github/actions/fetch-aws-sm@main
        with:
          role-to-assume: ${{ vars.AWS_GHA_ROLE_ARN }}
          secret-ids: |
            PREFECT_API_AUTH_STRING,prefect/staging-api-auth-string

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      # Must match the @ref on cleanup-prefect-branch-deployments.yml in consumer callers.
      - name: Resolve deployment identifiers
        id: identifiers
        uses: cyclops-mrv/python-dev-standards/.github/actions/parse-prefect-deployment-identifiers@main
        with:
          project_dir: ${{ inputs.project_dir }}
          prefect_file: ${{ inputs.prefect_file }}

      - name: Delete staging branch deployments
        env:
          DEPLOYMENTS: ${{ steps.identifiers.outputs.deployments }}
          PREFECT_API_AUTH_STRING: ${{ env.PREFECT_API_AUTH_STRING }}
          PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
        run: |
          set -euo pipefail

          echo "Cleaning branch '${BRANCH_NAME}' with slug '${BRANCH_SLUG}'"

          if [ -z "${DEPLOYMENTS}" ]; then
            echo "No deployments found in ${{ inputs.prefect_file }}"
            exit 1
          fi

          while IFS=$'\t' read -r FLOW_NAME BASE_NAME; do
            IDENTIFIER="${FLOW_NAME}/${BASE_NAME}-${BRANCH_SLUG}"
            echo "Deleting ${IDENTIFIER}"
            uv run --project "${{ inputs.project_dir }}" --only-group deployment \
              prefect --no-prompt deployment delete "${IDENTIFIER}" || true
          done <<< "${DEPLOYMENTS}"
