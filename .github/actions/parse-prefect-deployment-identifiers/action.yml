name: Parse Prefect deployment identifiers
description: Resolve {flow.name}/{deployment.name} pairs from prefect.yaml entrypoints

inputs:
  project_dir:
    description: Directory containing pyproject.toml; prefect_file is relative to this path
    required: false
    default: "."
  prefect_file:
    description: Path to prefect.yaml relative to project_dir
    required: true
    default: deployment/prefect.yaml

outputs:
  deployments:
    description: Tab-separated flow_name and base deployment name, one pair per line
    value: ${{ steps.run.outputs.deployments }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        set -euo pipefail
        PREFECT_FILE="${{ inputs.project_dir == '.' && inputs.prefect_file || format('{0}/{1}', inputs.project_dir, inputs.prefect_file) }}"
        DEPLOYMENTS="$(uv run --project "${{ inputs.project_dir }}" --only-group deployment \
          python "${GITHUB_ACTION_PATH}/parse.py" "${PREFECT_FILE}")"
        {
          echo "deployments<<EOF"
          echo "${DEPLOYMENTS}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"
